
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fffaf7">
    <meta name="description"
          content="Understand food labels, ingredients, nutrition, and allergens with personalized food insights.">

    <title>{% block title %}SHE Scan AI{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ url_for('home') }}">
            <span class="brand-mark">s</span>
            <span>she<span class="brand-light">scan</span></span>
        </a>

        <button class="menu-toggle"
                id="menuToggle"
                aria-label="Toggle navigation"
                aria-expanded="false">
            ☰
        </button>

        <nav class="main-nav" id="mainNav">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="#how-it-works">How it works</a>
            <a href="#features">Features</a>
            <a class="nav-cta" href="#scan">Try food scan <span>↗</span></a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <a class="brand footer-brand" href="{{ url_for('home') }}">
            <span class="brand-mark">s</span>
            <span>she<span class="brand-light">scan</span></span>
        </a>
        <p>Better food understanding starts with the label.</p>
        <span class="footer-note">An informational prototype · Not medical advice</span>
    </footer>
</body>
</html>
